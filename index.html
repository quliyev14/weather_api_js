<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card">
    <div class="search">
      <input id="cityInput" type="text" placeholder="Enter a city">
      <button id="search" onclick="Search()">Search</button>
    </div>

    <p id="message"></p>

    <div id="result">
      <h1 class="city" id="city"></h1>
      <p class="country" id="country"></p>
      <img class="icon" id="icon" alt="Hava ikonu">
      <p class="temp" id="temp"></p>
      <p class="condition" id="condition"></p>
      
      <div class="details">
          <div><span>Feels</span><strong id="feels"></strong></div>
          <div><span>Wind</span><strong id="wind"></strong></div>
          <div><span>Humidity</span><strong id="humidity"></strong></div>
        </div>
    </div>
    <div class="last-box" id="lastBox">
     <span class="last-title">Last search please click</span>
     <span class="last-city" id="lastCity"></span>
    </div>
</div>

    <script src="index.js"></script>
</body>

</html>
